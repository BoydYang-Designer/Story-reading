<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reading Challenge</title>
  <link rel="stylesheet" href="story.css">
</head>
<body>
  <div class="container">
    <div id="home-view">
      <h1>Reading Challenge</h1>
      <div id="category-list" class="list"></div>
      <div id="go-to-note" class="category-item">Note</div>
    </div>

    <div id="category-view" hidden>
      <h1 id="category-title"></h1>
      <div id="title-list" class="list"></div>
      <div id="fixed-controls-container">
        <div class="controls">
            <button class="secondary" id="back-to-home">Back to Categories</button>
        </div>
      </div>
    </div>


    <div id="playback-view" hidden>
      <h1 id="playback-title"></h1>
      <div id="text-container"></div>

      <div id="staging-area">
        <div class="staging-header">
          <span>Staging Area</span>
          <div class="staging-header-actions">
            <button id="add-to-note-btn">Add to Note</button>
            <button id="clear-staging-btn" class="secondary">Clear</button>
            <button id="copy-staged-btn" class="secondary">Copy</button>
          </div>
        </div>
        <div id="staged-words-container" placeholder="Click words from the text above to add them here...">
          </div>
      </div>

      <div id="fixed-controls-container">
        <div class="controls">
          <input type="range" id="progress-bar" min="0" max="100" value="0">
          
<div class="playback-actions">
            <button id="rewind-5" title="Rewind 5s">
              <svg class="icon-rewind" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 19 2 12 11 5 11 19"></polygon><polygon points="22 19 13 12 22 5 22 19"></polygon></svg>
            </button>
            <button id="play-pause" title="Play/Pause">
              <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            <button id="forward-5" title="Forward 5s">
              <svg class="icon-forward" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"></polygon><polygon points="2 19 11 12 2 5 2 19"></polygon></svg>
            </button>
          </div>
          <div class="navigation-actions">
            <button id="prev-story" class="secondary" hidden>上一則</button>
            <button class="secondary" id="back-to-category">Back to Titles</button>
            <button id="go-to-story-note-btn" class="secondary">Note</button>
            <button id="next-story" class="secondary" hidden>下一則</button>
          </div>
        </div>
      </div>
    </div>


    <div id="note-view" hidden>
        <h1>Word Note</h1>
        <div id="add-word-form" hidden>
          <input type="text" id="new-word-input" placeholder="Enter a new word or sentence...">
          <button id="add-manual-word-btn">Add</button>
        </div>
        
        <div id="note-content-wrapper">
          <div class="note-section-header"><h3>Words</h3></div>
          <div id="note-list-words" class="list"></div>
          
          <div class="note-section-header"><h3>Phrases</h3></div>
          <div id="note-list-phrases" class="list"></div>

          <div class="note-section-header"><h3>Sentences</h3></div>
          <div id="note-list-sentences" class="list"></div>
        </div>
        <div class="note-actions">
            <button id="export-words-btn">Copy All Items</button>
            <button class="secondary" id="back-to-story-from-note-btn" hidden>Back to Story</button>
            <button class="secondary" id="back-to-home-from-note">Back to Home</button>
        </div>
    </div>


    <audio id="audio"></audio>
    <p hidden>This app requires JavaScript to run.</p>
  </div>
  <script src="story.js"></script>
</body>
</html>
